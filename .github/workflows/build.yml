name: Build MFi Release Camery
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIPLAY_AUTH_ASSETS_DIR: ${{ github.workspace }}/_mfi_tmp
      KS_ALIAS: repack
      KS_STOREPASS: 123456
      KS_KEYPASS: 123456
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 新建临时目录，写入MFi证书
        run: |
          mkdir -p ${{ env.DIPLAY_AUTH_ASSETS_DIR }}
          echo "${{ secrets.MFI_PK8_BASE64 }}" | base64 -d > ${{ env.DIPLAY_AUTH_ASSETS_DIR }}/identity.pk8
          echo "${{ secrets.MFI_P7B_BASE64 }}" | base64 -d > ${{ env.DIPLAY_AUTH_ASSETS_DIR }}/certificate.p7b

      - name: 云端直接生成 repack.keystore
        run: |
          mkdir -p .signing
          keytool -genkeypair -v -keystore .signing/repack.keystore -keyalg RSA -keysize 2048 -validity 10000 \
          -alias ${{ env.KS_ALIAS }} -storepass ${{ env.KS_STOREPASS }} -keypass ${{ env.KS_KEYPASS }} \
          -dname "CN=user,OU=user,O=user,L=user,ST=user,C=CN"

      - name: 给gradlew权限
        run: chmod +x gradle

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Camery-final
          path: mobile/build/outputs/apk/release/mobile-release.apk
