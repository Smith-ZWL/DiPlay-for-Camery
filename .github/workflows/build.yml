name: 打包 assembleStandaloneDebug（匹配当前build.gradle）
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉源码
        uses: actions/checkout@v4
      - name: JDK17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # 重点：它要求证书放在 .private/runtime-assets/offline-mfi
      - name: 创建它指定的证书目录、注入MFi证书
        run: |
          mkdir -p .private/runtime-assets/offline-mfi
          echo "${{ secrets.MFI_PK8_BASE64 }}" | base64 -d > .private/runtime-assets/offline-mfi/identity.pk8
          echo "${{ secrets.MFI_P7B_BASE64 }}" | base64 -d > .private/runtime-assets/offline-mfi/certificate.p7b

      - name: chmod gradlew
        run: chmod +x gradlew

      # ✅ 正确任务名： assembleStandaloneDebug，不是 Release！！
      - name: Gradle编译
        run: ./gradlew :mobile:clean :mobile:assembleStandaloneDebug --stacktrace

      - name: 查找apk
        id: findapk
        run: |
          APK=$(find mobile/build -name "mobile-debug.apk")
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "$APK"

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: Camery-DiPlay-Standalone-Debug
          path: ${{ steps.findapk.outputs.apk_path }}
          if-no-files-found: error
