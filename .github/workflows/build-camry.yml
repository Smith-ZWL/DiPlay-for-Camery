name: Build DiPlay Camery
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 注入MFi证书
        run: |
          mkdir -p mobile/src/main/assets/offline-mfi
          echo "${{ secrets.MFI_PK8_BASE64 }}" | base64 -d > mobile/src/main/assets/offline-mfi/identity.pk8
          echo "${{ secrets.MFI_P7B_BASE64 }}" | base64 -d > mobile/src/main/assets/offline-mfi/certificate.p7b

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: 编译 debug包
        run: ./gradlew :mobile:clean :mobile:assembleDebug -Pdiplay.analytics=none

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: Camery-DiPlay
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
