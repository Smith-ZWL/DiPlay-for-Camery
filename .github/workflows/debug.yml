name: camry
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 把MFi证书写入assets目录（最简单方式）
        run: |
          mkdir -p mobile/src/main/assets/offline-mfi
          echo "${{ secrets.MFI_PK8_BASE64 }}" | base64 -d > mobile/src/main/assets/offline-mfi/identity.pk8
          echo "${{ secrets.MFI_P7B_BASE64 }}" | base64 -d > mobile/src/main/assets/offline-mfi/certificate.p7b

      - name: chmod
        run: chmod +x gradlew

      - name: 编译Debug包
        run: ./gradlew :mobile:clean :mobile:assembleDebug

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: camry
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
